<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malar | Nivedita Rethnakar</title>
<meta name="description" content="Malar: beadwork by Nivedita Rethnakar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/warm.css">
<style>
.page-title .script{display:block; font-size:1.5rem; color:var(--ink-faint); margin-top:2px;}

/* masonry gallery: add a <figure> per piece */
.gallery{
  columns:3 260px;
  column-gap:22px;
}
.piece{
  break-inside:avoid;
  margin:0 0 22px;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 0 0 1px var(--line), 0 18px 36px -24px rgba(80,50,40,.5);
}
.piece button{
  display:block; width:100%; padding:0; border:0; background:none; cursor:zoom-in;
}
.piece img{display:block; width:100%; height:auto;}
.piece figcaption{padding:12px 16px 14px;}
.piece .title{
  font-family:var(--serif-display);
  font-weight:600;
  font-size:1.3rem;
  margin:0;
}
.piece .detail{margin:2px 0 0; color:var(--ink-faint); font-size:1rem;}

.empty{
  max-width:520px;
  margin:10px auto 0;
  padding:34px 28px;
  text-align:center;
  border-radius:16px;
  background:var(--card);
  box-shadow:0 0 0 1px var(--line);
  color:var(--ink-soft);
  font-size:1.12rem;
  line-height:1.65;
}
.empty .petals{font-size:2rem; color:var(--rose); letter-spacing:.3em; display:block; margin-bottom:6px;}

/* enlarged view */
dialog.viewer{
  border:0; padding:0; background:transparent; max-width:min(92vw,1100px); max-height:92vh;
}
dialog.viewer::backdrop{background:rgba(40,28,24,.72);}
dialog.viewer img{display:block; max-width:100%; max-height:84vh; border-radius:10px; margin:auto;}
dialog.viewer p{color:#f6eee2; text-align:center; font-size:1.1rem; margin:10px 0 0;}
dialog.viewer .close{
  position:fixed; top:14px; right:18px;
  font:inherit; font-size:2rem; line-height:1;
  background:none; border:0; color:#f6eee2; cursor:pointer;
}
</style>
</head>

<body>

<canvas id="wash" aria-hidden="true"></canvas>

<main class="page">

  <div class="star small">
    <a href="/" aria-label="Home"><img src="/images/alumstarclear.png" alt=""></a>
  </div>

  <h1 class="page-title">Malar <span class="script" lang="ml">മലർ</span></h1>
  <!-- DRAFT intro: Nivedita to rewrite in her own words -->
  <p class="page-lead">Malar means blossom. This is where I keep my beadwork: flowers and small pieces made bead by bead, row by row, on wire.</p>

  <!--
    To add a piece, copy this block into .gallery and put the photo in /images/malar/.
    Wide or tall photos both work; the grid arranges them.

    <figure class="piece">
      <button type="button"><img src="/images/malar/lotus.jpg" alt="Beaded pink lotus" loading="lazy"></button>
      <figcaption>
        <p class="title">Lotus</p>
        <p class="detail">Glass seed beads on wire, 2025</p>
      </figcaption>
    </figure>
  -->
  <div class="gallery" id="gallery"></div>

  <p class="empty" id="empty" hidden>
    <span class="petals" aria-hidden="true">✿ ✿ ✿</span>
    Photographs of my pieces are on their way.
  </p>

  <div class="star bottom">
    <a href="/" aria-label="Home"><img src="/images/alumstarclear.png" alt=""></a>
  </div>

</main>

<dialog class="viewer" id="viewer" aria-label="Enlarged photo">
  <button class="close" type="button" aria-label="Close">×</button>
  <img alt="">
  <p></p>
</dialog>

<script src="/assets/js/wash.js"></script>
<script>
(function(){
  var gallery = document.getElementById('gallery');
  var pieces = gallery.querySelectorAll('.piece');
  document.getElementById('empty').hidden = pieces.length > 0;

  var viewer = document.getElementById('viewer');
  var vImg = viewer.querySelector('img'), vCap = viewer.querySelector('p');
  gallery.addEventListener('click', function(e){
    var btn = e.target.closest('.piece button');
    if(!btn || !viewer.showModal) return;
    var img = btn.querySelector('img'), title = btn.parentNode.querySelector('.title');
    vImg.src = img.currentSrc || img.src;
    vImg.alt = img.alt;
    vCap.textContent = title ? title.textContent : '';
    viewer.showModal();
  });
  viewer.addEventListener('click', function(e){ if(e.target === viewer || e.target.classList.contains('close')) viewer.close(); });
})();
</script>
</body>
</html>
